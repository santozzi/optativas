# docker-compose.dev.yml — Desarrollo (dev branch)
# Usar: docker compose -f docker-compose.dev.yml up
# Puertos: 5434 (DB), 3013 (API Node ext), 3014 (Web)
version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: proyecto-pdf-db-dev
    environment:
      POSTGRES_USER: pdfuser
      POSTGRES_PASSWORD: pdfpass
      POSTGRES_DB: promedb
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    networks:
      - pdf-network-dev
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pdfuser"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: proyecto-pdf-api-dev
    environment:
      - DB_HOST=proyecto-pdf-db-dev
      - DB_PORT=5432
      - DB_USER=pdfuser
      - DB_PASS=pdfpass
      - DB_NAME=promedb
      - PORT=3001
    ports:
      - "3013:3001"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - pdf-network-dev
    volumes:
      - ./backend/uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: proyecto-pdf-web-dev
    environment:
      - VITE_API_HOST=proyecto-pdf-api-dev
      - VITE_API_PORT=3001
    ports:
      - "3014:80"
    depends_on:
      - backend
    networks:
      - pdf-network-dev

  backend-python:
    build:
      context: ./backend-python
      dockerfile: Dockerfile
    container_name: proyecto-pdf-python-dev
    environment:
      - DB_HOST=proyecto-pdf-db-dev
      - DB_PORT=5432
      - DB_USER=pdfuser
      - DB_PASS=pdfpass
      - DB_NAME=promedb
    ports:
      - "3020:5000"
    networks:
      - pdf-network-dev
    volumes:
      - ./backend-python/uploads:/app/uploads

volumes:
  postgres_data_dev:

networks:
  pdf-network-dev:
    driver: bridge